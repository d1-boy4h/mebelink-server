  postgres:
      image: postgres:18
      environment:
        POSTGRES_DB: mebelink
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: nimda
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql
      healthcheck:
        test: ['CMD', 'pg_isready', '-U', 'admin', '-d', 'mebelink']
        interval: 2s
        timeout: 2s
        retries: 10

volumes:
  postgres_data:
