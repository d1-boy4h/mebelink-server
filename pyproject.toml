[project]
name = "mebelink-server"
version = "1.0"
description = "FastAPI server for MebeLink"
readme = "README.md"
authors = [{ name = "d1_boy4h", email = "d1.boy4h@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[tool.ruff.lint]
extend-select = ["W293"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
